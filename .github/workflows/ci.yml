# Type check, tests and build on every push to main and on every pull request,
# so a broken commit shows up right away and not only at release time.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Puppeteer is only needed by the "chrome" job below.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

  # The panel in real Chrome for Testing (headless): what the fake browser cannot see, such as native
  # drag and drop (scripts/drag-check.mjs) and the whole flow of the smoke test.
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - run: npm ci
      - run: npm run smoke
      - run: npm run build && node scripts/drag-check.mjs
